name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  schema-validation:
    name: Validate schemas + dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      - run: python3 scripts/validate_schemas.py
      - run: python3 scripts/validate_dataset.py
      - run: python3 scripts/run_scenario_tests.py

  worker-unit-tests:
    name: Worker unit tests (contracts + drift guards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      # Cross-repo drift tests self-skip when the sibling akouo/py-akousma
      # checkouts are absent (as here); the contract and schema assertions
      # still run. Locally, run these with the siblings present.
      - run: python3 scripts/test_provider_contracts.py
      - run: python3 scripts/test_oida_gateway.py
      - run: python3 scripts/test_listening_plan.py
      - run: python3 scripts/test_akousmata_source.py

  web-build:
    name: Web app type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  studio-verify:
    name: Studio lint + typecheck + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run verify
