# Portable PR checks run once; full platform qualification is deliberate.
name: ci

on:
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      full:
        description: Run complete platform and release qualification (prefer local execution)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-validation:
    name: Validate schemas + dataset
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      - run: python3 scripts/validate_schemas.py
      - run: python3 scripts/validate_dataset.py
      - run: python3 scripts/run_scenario_tests.py

  worker-unit-tests:
    name: Worker unit tests (contracts + drift guards)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      # Cross-repo drift tests self-skip when the sibling akouo/py-akousma
      # checkouts are absent (as here); the contract and schema assertions
      # still run. Locally, run these with the siblings present.
      - run: python3 scripts/test_provider_contracts.py
      - run: python3 scripts/test_oida_gateway.py
      - run: python3 scripts/test_listening_plan.py
      - run: python3 -m pip install pytest
      - run: python3 -m pytest scripts/test_generate_reports.py
      - run: python3 scripts/test_akousmata_source.py

  web-build:
    name: Web app type-check + build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  studio-verify:
    name: Studio lint + typecheck + tests + build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run verify
